<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}PDF MASTAR{% endblock %}</title>
<style>
:root{--brand:#5b5bf0;--brand2:#8b5cf6;--ok:#10b981;--err:#ef4444;--bg:#f6f7fb;--card:#ffffff;--text:#1e293b;--muted:#64748b;--line:#e2e8f0;--radius:16px;--shadow:0 4px 6px -1px rgb(0 0 0 / 0.05)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--brand);text-decoration:none}
.container{max-width:1100px;margin:0 auto;padding:0 20px;width:100%}
header{background:var(--card);border-bottom:1px solid var(--line);padding:16px 0;position:sticky;top:0;z-index:100}
.nav{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:1.4rem;font-weight:800;color:var(--text)}
.logo span{color:var(--brand)}
main{flex:1;padding:20px 0}
footer{background:var(--card);border-top:1px solid var(--line);padding:24px 0;text-align:center;color:var(--muted);font-size:.9rem;margin-top:auto}
</style>
{% block css %}{% endblock %}
</head>
<body>
<header>
<div class="container nav">
<a href="/" class="logo">PDF <span>MASTAR</span></a>
</div>
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
<footer>
<div class="container">
<p>Files processed in memory. Free, no sign-up.</p>
<p style="margin-top:8px">PDF MASTAR</p>
</div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
