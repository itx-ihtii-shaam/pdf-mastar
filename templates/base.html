<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
    <link rel="icon" type="image/png" href="/icon-192.png?v=99">
    <style>
        /* Dark Theme Default Variables */
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131826;
            --card-hover: #161c2e;
            --border-color: #232a42;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --nav-bg: #0b0f19;
            --input-bg: #131826;
            --badge-bg: rgba(99, 102, 241, 0.1);
        }

        /* Clean & Beautiful Light Theme Variables */
        body.light-theme {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --card-hover: #f8fafc;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #475569;
            --nav-bg: #ffffff;
            --input-bg: #ffffff;
            --badge-bg: rgba(99, 102, 241, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            min-height: 100vh; 
            transition: background 0.3s ease, color 0.3s ease;
        }

        .navbar { 
            background: var(--nav-bg); 
            padding: 0 40px; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 1px solid var(--border-color); 
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        
        .nav-container { 
            max-width: 1300px; 
            margin: 0 auto; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            height: 74px; 
        }

        .logo { 
            font-size: 18px; 
            font-weight: 800; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            color: var(--text-main); 
            padding: 8px 14px;
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
        }

        .logo:hover {
            background: rgba(99, 102, 241, 0.12);
            border-color: rgba(99, 102, 241, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.2);
        }

        .logo:active {
            transform: translateY(1px) scale(0.98);
        }

        .logo-icon { 
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); 
            width: 36px; 
            height: 36px; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 14px; 
            font-weight: 900; 
            color: white; 
            transition: transform 0.3s ease;
        }

        .logo:hover .logo-icon {
            transform: rotate(-6deg) scale(1.05);
        }

        .nav-right { display: flex; align-items: center; gap: 12px; }

        .theme-btn { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            color: var(--text-main); 
            font-size: 18px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .theme-btn:hover {
            border-color: #6366f1;
            transform: scale(1.08);
        }

        .main-content { min-height: calc(100vh - 140px); }

        footer { 
            background: var(--nav-bg); 
            color: var(--text-muted); 
            padding: 40px 20px; 
            text-align: center; 
            border-top: 1px solid var(--border-color); 
            font-size: 13px; 
            transition: background 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <div class="logo-icon">📄</div>
                <span>{{ SITE_NAME }}</span>
            </a>
            <div class="nav-right">
                <button class="theme-btn" id="theme-toggle" title="Toggle Light/Dark Theme">🌓</button>
            </div>
        </div>
    </nav>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>&copy; {{ SITE_NAME }}. All rights reserved.</p>
    </footer>

    <script>
        const themeBtn = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme');

        if (currentTheme === 'light') {
            document.body.classList.add('light-theme');
            themeBtn.textContent = '☀️';
        } else {
            themeBtn.textContent = '🌙';
        }

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            let theme = 'dark';
            if (document.body.classList.contains('light-theme')) {
                theme = 'light';
                themeBtn.textContent = '☀️';
            } else {
                themeBtn.textContent = '🌙';
            }
            localStorage.setItem('theme', theme);
        });
    </script>
</body>
</html>
