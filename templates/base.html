<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{{ SITE_NAME }} - Free online PDF tools{% endblock %}</title>
<meta name="description" content="{% block desc %}Merge, split, compress, convert and protect PDFs online. Free, fast and no sign-up.{% endblock %}">
<meta name="theme-color" content="#5b5bf0">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📄%3C/text%3E%3C/svg%3E">
<script>
try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}
</script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#14162b;--muted:#6b7089;--line:#e6e8f2;--brand:#5b5bf0;--brand2:#8b5cf6;--ok:#16a34a;--err:#dc2626;--shadow:0 6px 24px rgba(20,22,43,.07);--radius:18px;--accent:var(--brand)}
[data-theme=dark]{--bg:#0e1020;--card:#171a31;--text:#eef0ff;--muted:#9aa0c3;--line:#262a4a;--shadow:0 6px 24px rgba(0,0,0,.35)}
.cat-organize{--accent:#5b5bf0}.cat-edit{--accent:#0ea5e9}.cat-secure{--accent:#f59e0b}.cat-convert{--accent:#10b981}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:800;font-size:1.15rem;display:flex;gap:10px;align-items:center}
.logo .mark{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--text);width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:16px}
.icon-btn:hover{border-color:var(--brand)}
.nav-right{display:flex;gap:10px;align-items:center}
.btn-install{border:1px solid var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--card));color:var(--brand);height:38px;padding:0 14px;border-radius:12px;cursor:pointer;font-weight:700;font-size:.88rem;font-family:inherit}
.btn-install:hover{background:var(--brand);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0;padding:14px 26px;border-radius:14px;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 8px 20px rgba(91,91,240,.28);transition:transform .15s,opacity .15s;font-family:inherit}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none}
.error{background:color-mix(in srgb,var(--err) 12%,var(--card));border:1px solid color-mix(in srgb,var(--err) 40%,transparent);color:var(--err);padding:12px 14px;border-radius:12px;margin:14px 0;font-weight:500}
footer{border-top:1px solid var(--line);margin-top:60px;padding:28px 0;color:var(--muted);font-size:.9rem;text-align:center}
.badges{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.badge{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.85rem;color:var(--muted)}
.tool{display:flex;gap:14px;padding:18px;transition:transform .18s,border-color .18s,box-shadow .18s}
.tool:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 30px rgba(20,22,43,.12)}
.tool h3{margin:0 0 2px;font-size:1.02rem}
.tool p{margin:0;color:var(--muted);font-size:.9rem}
.ico{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--accent) 15%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 60%,transparent);outline-offset:2px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
{% block css %}{% endblock %}
</style>
</head>
<body>
<header class="top">
  <div class="wrap nav">
    <a class="logo" href="/"><span class="mark">📄</span>{{ SITE_NAME }}</a>
    <div class="nav-right">
      <button class="btn-install" id="installBtn" type="button" hidden>⬇ Install app</button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">🌓</button>
    </div>
  </div>
</header>

<main>{% block content %}{% endblock %}</main>

<footer>
  <div class="wrap">
    <div class="badges">
      <span class="badge">🔒 Files are processed in memory and not saved on our server</span>
      <span class="badge">⚡ Free, no sign-up</span>
      <span class="badge">📱 Works on mobile</span>
    </div>
    <p style="margin:16px 0 0">© {{ SITE_NAME }}</p>
  </div>
</footer>

<script>
document.getElementById('themeBtn').addEventListener('click',function(){
  var next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('theme',next)}catch(e){}
});

/* PWA: service worker + "Install app" button */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})});
}
(function(){
  var deferred=null,btn=document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;btn.hidden=false});
  btn.addEventListener('click',function(){
    if(!deferred) return;
    deferred.prompt();
    deferred.userChoice.finally(function(){deferred=null;btn.hidden=true});
  });
  window.addEventListener('appinstalled',function(){btn.hidden=true});
})();

/* Streak and badges - sirf is browser mein save hota hai, server par kuch nahi jata */
window.Stats=(function(){
  var KEY='stats';
  var BADGES=[
    {id:'first',icon:'🌱',name:'First file',hint:'Process your first file',test:function(s){return s.total>=1}},
    {id:'streak3',icon:'🔥',name:'3-day streak',hint:'Use the site 3 days in a row',test:function(s){return s.streak>=3}},
    {id:'ten',icon:'🚀',name:'10 files',hint:'Process 10 files',test:function(s){return s.total>=10}},
    {id:'explorer',icon:'🧭',name:'Explorer',hint:'Try 5 different tools',test:function(s){return s.tools.length>=5}}
  ];
  function day(d){return (d||new Date()).toLocaleDateString('en-CA')}
  function get(){
    try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s.total==='number') return s}catch(e){}
    return {total:0,streak:0,last:'',tools:[],badges:[]};
  }
  function bump(slug){
    var s=get(),t=day(),y=day(new Date(Date.now()-864e5)),before=s.badges.slice();
    s.total++;
    if(s.last!==t){s.streak=(s.last===y)?s.streak+1:1;s.last=t}
    if(s.tools.indexOf(slug)<0) s.tools.push(slug);
    BADGES.forEach(function(b){if(b.test(s)&&s.badges.indexOf(b.id)<0) s.badges.push(b.id)});
    try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}
    return {stats:s,fresh:BADGES.filter(function(b){return s.badges.indexOf(b.id)>-1&&before.indexOf(b.id)<0})};
  }
  return {get:get,bump:bump,BADGES:BADGES};
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
