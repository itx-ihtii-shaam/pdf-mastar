<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
    <link rel="icon" type="image/png" href="/icon-192.png?v=99">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0b0f19; color: #ffffff; min-height: 100vh; }
        .navbar { background: #0b0f19; padding: 0 40px; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .nav-container { max-width: 1300px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 74px; }
        .logo { font-size: 18px; font-weight: 800; text-decoration: none; display: flex; align-items: center; gap: 10px; color: #ffffff; }
        .logo-icon { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: white; }
        .nav-right { display: flex; align-items: center; gap: 12px; }
        .install-btn { background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); padding: 8px 16px; border-radius: 50px; font-size: 13px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 6px; }
        .theme-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .main-content { min-height: calc(100vh - 140px); }
        footer { background: #0b0f19; color: #64748b; padding: 40px 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <div class="logo-icon">📄</div>
                <span>{{ SITE_NAME }}</span>
            </a>
            <div class="nav-right">
                <a href="#" class="install-btn">⬇ Install app</a>
                <div class="theme-btn">🌓</div>
            </div>
        </div>
    </nav>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>&copy; {{ SITE_NAME }}. All rights reserved.</p>
    </footer>
</body>
</html>
